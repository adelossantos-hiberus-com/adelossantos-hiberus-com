[project]
name = "comercio-exterior-demo"
version = "0.1.0"
description = "Demo de análisis de comercio exterior con datos ficticios (Python + SQL, Databricks)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "duckdb>=1.0", "pyarrow>=15", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27", "playwright>=1.40"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["e2e: pruebas de extremo a extremo con navegador (Playwright + Chromium)"]
