[project]
name = "comercio-exterior-demo"
version = "0.1.0"
description = "Demo de análisis de comercio exterior con datos ficticios (Python + SQL, Databricks)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
